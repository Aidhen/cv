services:
  node-cli:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules

  dev-server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"